<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Controle de Estoque - Oficina</title>

  <!-- Meta Tags PWA estritas para Android e iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Estoque">
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="./manifest.json">

  <!-- Script para bloquear visualização de aba no Chrome -->
  <script>
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      document.documentElement.classList.add('pwa-mode');
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #d32f2f;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Form Card */
    .card {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
      border: 1px solid #333;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 5px;
    }

    input {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 10px;
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: #d32f2f;
    }

    .btn {
      background-color: #d32f2f;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      font-size: 1rem;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: #b71c1c;
    }

    .btn-secondary {
      background-color: #333;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: #444;
    }

    .btn-warning {
      background-color: #f57c00;
    }

    .btn-warning:hover {
      background-color: #e65100;
    }

    /* Controls Bar */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
    }

    /* Table */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #333;
    }

    th {
      background-color: #2a2a2a;
      color: #d32f2f;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    tr:hover {
      background-color: #252525;
    }

    .qty-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      display: inline-block;
    }

    .qty-normal { background-color: #1b5e20; color: #4caf50; }
    .qty-low { background-color: #e65100; color: #ff9800; }
    .qty-zero { background-color: #b71c1c; color: #ff8a80; }

    .actions-cell {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .btn-edit { background-color: #0288d1; color: white; }
    .btn-delete { background-color: #d32f2f; color: white; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
      border: 1px solid #d32f2f;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal h2 {
      color: #d32f2f;
      margin-bottom: 15px;
    }

    .modal-list {
      list-style: none;
      margin-bottom: 15px;
    }

    .modal-list li {
      padding: 8px 0;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
    }

    /* Otimizações para Telas Pequenas */
    @media (max-width: 600px) {
      body { padding: 10px; }
      th, td { padding: 8px 10px; font-size: 0.9rem; }
      .actions-cell { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Controle de Estoque</h1>

    <!-- Form -->
    <div class="card">
      <form id="itemForm">
        <input type="hidden" id="editIndex" value="-1">
        <div class="form-grid">
          <div class="form-group">
            <label for="code">Código/Referência</label>
            <input type="text" id="code" required placeholder="Ex: INJ-001">
          </div>
          <div class="form-group">
            <label for="name">Descrição da Peça</label>
            <input type="text" id="name" required placeholder="Ex: Injetor Bosch Common Rail">
          </div>
          <div class="form-group">
            <label for="qty">Quantidade</label>
            <input type="number" id="qty" required min="0" value="1">
          </div>
          <div class="form-group">
            <label for="minQty">Qtd. Mínima Alertar</label>
            <input type="number" id="minQty" required min="0" value="2">
          </div>
        </div>
        <button type="submit" class="btn" id="saveBtn">Salvar Peça</button>
      </form>
    </div>

    <!-- Controls -->
    <div class="controls">
      <input type="text" id="search" class="search-box" placeholder="Buscar por código ou descrição..." oninput="renderData()">
      <button class="btn btn-warning" onclick="checkAlerts()">Ver Alertas de Estoque</button>
      <button class="btn btn-secondary" onclick="exportData()">Exportar Dados</button>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Qtd.</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Conteúdo alimentado via JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Alertas -->
  <div class="modal" id="alertModal">
    <div class="modal-content">
      <h2>Atenção: Peças em Falta/Baixas</h2>
      <ul class="modal-list" id="alertList"></ul>
      <button class="btn" onclick="closeModal()">Fechar</button>
    </div>
  </div>

  <script>
    let inventory = JSON.parse(localStorage.getItem('oficina_estoque')) || [];

    const itemForm = document.getElementById('itemForm');
    const saveBtn = document.getElementById('saveBtn');
    const editIndexInput = document.getElementById('editIndex');

    itemForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const code = document.getElementById('code').value.trim();
      const name = document.getElementById('name').value.trim();
      const qty = parseInt(document.getElementById('qty').value);
      const minQty = parseInt(document.getElementById('minQty').value);
      const editIndex = parseInt(editIndexInput.value);

      if (editIndex === -1) {
        inventory.push({ code, name, qty, minQty });
      } else {
        inventory[editIndex] = { code, name, qty, minQty };
        editIndexInput.value = -1;
        saveBtn.innerText = 'Salvar Peça';
      }

      saveAndRender();
      itemForm.reset();
      document.getElementById('qty').value = 1;
      document.getElementById('minQty').value = 2;
    });

    function saveAndRender() {
      localStorage.setItem('oficina_estoque', JSON.stringify(inventory));
      renderData();
    }

    function renderData() {
      const tbody = document.getElementById('tableBody');
      const searchTerm = document.getElementById('search').value.toLowerCase();
      tbody.innerHTML = '';

      inventory.forEach((item, index) => {
        if (item.code.toLowerCase().includes(searchTerm) || item.name.toLowerCase().includes(searchTerm)) {
          let badgeClass = 'qty-normal';
          if (item.qty === 0) badgeClass = 'qty-zero';
          else if (item.qty <= item.minQty) badgeClass = 'qty-low';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.code}</td>
            <td>${item.name}</td>
            <td><span class="qty-badge ${badgeClass}">${item.qty}</span></td>
            <td class="actions-cell">
              <button class="btn-action btn-edit" onclick="editItem(${index})">Editar</button>
              <button class="btn-action btn-delete" onclick="deleteItem(${index})">Excluir</button>
            </td>
          `;
          tbody.appendChild(tr);
        }
      });
    }

    function editItem(index) {
      const item = inventory[index];
      document.getElementById('code').value = item.code;
      document.getElementById('name').value = item.name;
      document.getElementById('qty').value = item.qty;
      document.getElementById('minQty').value = item.minQty;
      editIndexInput.value = index;
      saveBtn.innerText = 'Atualizar Peça';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteItem(index) {
      if (confirm('Deseja realmente remover esta peça do estoque?')) {
        inventory.splice(index, 1);
        saveAndRender();
      }
    }

    function checkAlerts() {
      const alertList = document.getElementById('alertList');
      alertList.innerHTML = '';
      
      const lowStockItems = inventory.filter(item => item.qty <= item.minQty);

      if (lowStockItems.length === 0) {
        alertList.innerHTML = '<li>Todas as peças estão acima do nível mínimo!</li>';
      } else {
        lowStockItems.forEach(item => {
          const li = document.createElement('li');
          const status = item.qty === 0 ? 'ZERADO' : 'BAIXO';
          li.innerHTML = `<span><strong>${item.name}</strong> (${item.code})</span> <span style="color: ${item.qty === 0 ? '#ff8a80' : '#ff9800'}">${status}: ${item.qty} un</span>`;
          alertList.appendChild(li);
        });
      }

      document.getElementById('alertModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('alertModal').style.display = 'none';
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(inventory, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "backup_estoque_oficina.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    renderData();
  </script>

  <!-- Registro do Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado!', reg))
          .catch(err => console.log('Erro no Registro do SW:', err));
      });
    }
  </script>
</body>
</html>
