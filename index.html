<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Estoque - Oficina</title>
  <style>
    :root {
      --bg-primary: #121212;
      --bg-surface: #1e1e1e;
      --bg-card: #2a2a2a;
      --accent-red: #d32f2f;
      --accent-red-hover: #b71c1c;
      --text-main: #f5f5f5;
      --text-muted: #a0a0a0;
      --border-color: #333333;
      --success-green: #2e7d32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent-red);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    .badge-red {
      color: var(--accent-red);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 4px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-red);
    }

    .btn {
      width: 100%;
      padding: 10px;
      background-color: var(--accent-red);
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-red-hover);
    }

    .search-bar {
      margin-bottom: 20px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .product-img {
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 4px;
      background-color: #000;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-qty {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-qty:hover {
      background-color: var(--accent-red);
    }

    .status {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .status-ok {
      background-color: rgba(46, 125, 50, 0.2);
      color: #81c784;
    }

    .status-out {
      background-color: rgba(211, 47, 47, 0.2);
      color: #e57373;
    }

    .history-list {
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.85rem;
    }

    .history-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .history-item span {
      color: var(--text-main);
    }

    .btn-danger {
      background: none;
      border: none;
      color: var(--accent-red);
      cursor: pointer;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Oficina <span class="badge-red">| Controle de Estoque</span></h1>
    </header>

    <div class="grid">
      <div>
        <div class="card" style="margin-bottom: 20px;">
          <h2>Cadastrar Novo Item</h2>
          <form id="productForm">
            <div class="form-group">
              <label>Nome do Produto / Peça</label>
              <input type="text" id="pName" required placeholder="Ex: Injetor Bosch Common Rail">
            </div>
            <div class="form-group">
              <label>Código / Referência</label>
              <input type="text" id="pCode" placeholder="Ex: 0445110351">
            </div>
            <div class="form-group">
              <label>Quantidade Inicial</label>
              <input type="number" id="pQty" min="0" value="1" required>
            </div>
            <div class="form-group">
              <label>Foto do Produto (Upload ou URL)</label>
              <input type="file" id="pImgFile" accept="image/*" style="margin-bottom: 5px;">
              <input type="url" id="pImgUrl" placeholder="Ou cole o link da imagem">
            </div>
            <button type="submit" class="btn">Adicionar ao Estoque</button>
          </form>
        </div>

        <div class="card">
          <h2>Histórico de Movimentações</h2>
          <div class="history-list" id="historyList">
            </div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Buscar por nome ou código da peça..." onkeyup="renderProducts()">
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Foto</th>
                  <th>Peça / Código</th>
                  <th>Status</th>
                  <th>Qtd Disponível</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="productTable">
                </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let products = JSON.parse(localStorage.getItem('oficina_estoque')) || [];
    let history = JSON.parse(localStorage.getItem('oficina_historico')) || [];

    const productForm = document.getElementById('productForm');
    const pImgFile = document.getElementById('pImgFile');

    // Salvar estado no LocalStorage
    function saveData() {
      localStorage.setItem('oficina_estoque', JSON.stringify(products));
      localStorage.setItem('oficina_historico', JSON.stringify(history));
    }

    // Registrar movimentação
    function logMovement(productName, type, amount) {
      const now = new Date();
      const dateStr = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
      history.unshift({ date: dateStr, text: `${type}: ${amount}x ${productName}` });
      if (history.length > 30) history.pop(); // Mantém os últimos 30 registros
      saveData();
      renderHistory();
    }

    // Adicionar novo produto
    productForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const name = document.getElementById('pName').value;
      const code = document.getElementById('pCode').value || 'S/N';
      const qty = parseInt(document.getElementById('pQty').value);
      const urlInput = document.getElementById('pImgUrl').value;
      const fileInput = pImgFile.files[0];

      if (fileInput) {
        const reader = new FileReader();
        reader.onload = function(e) {
          addProduct(name, code, qty, e.target.result);
        };
        reader.readAsDataURL(fileInput);
      } else {
        const img = urlInput || 'https://via.placeholder.com/50?text=Peca';
        addProduct(name, code, qty, img);
      }
    });

    function addProduct(name, code, qty, img) {
      const newProduct = {
        id: Date.now(),
        name,
        code,
        qty: parseInt(qty),
        img
      };

      products.push(newProduct);
      logMovement(name, 'Entrada Inicial', qty);
      productForm.reset();
      renderProducts();
    }

    // Alterar quantidade (+ / -)
    function updateQty(id, change) {
      const prod = products.find(p => p.id === id);
      if (prod) {
        const oldQty = prod.qty;
        prod.qty += change;
        if (prod.qty < 0) prod.qty = 0;

        const diff = prod.qty - oldQty;
        if (diff !== 0) {
          const type = diff > 0 ? 'Adicionado' : 'Removido (Orçamento)';
          logMovement(prod.name, type, Math.abs(diff));
          renderProducts();
        }
      }
    }

    // Excluir produto
    function deleteProduct(id) {
      const prod = products.find(p => p.id === id);
      if (prod && confirm(`Remover "${prod.name}" do sistema?`)) {
        logMovement(prod.name, 'Item Removido', prod.qty);
        products = products.filter(p => p.id !== id);
        renderProducts();
      }
    }

    // Renderizar Tabela
    function renderProducts() {
      const table = document.getElementById('productTable');
      const search = document.getElementById('searchInput').value.toLowerCase();
      table.innerHTML = '';

      const filtered = products.filter(p => 
        p.name.toLowerCase().includes(search) || p.code.toLowerCase().includes(search)
      );

      if (filtered.length === 0) {
        table.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 20px;">Nenhum item encontrado no estoque.</td></tr>`;
        return;
      }

      filtered.forEach(p => {
        const hasStock = p.qty > 0;
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><img src="${p.img}" class="product-img" alt="Foto"></td>
          <td>
            <strong>${p.name}</strong><br>
            <small style="color: var(--text-muted)">Cód: ${p.code}</small>
          </td>
          <td>
            <span class="status ${hasStock ? 'status-ok' : 'status-out'}">
              ${hasStock ? 'DISPONÍVEL' : 'SEM ESTOQUE'}
            </span>
          </td>
          <td>
            <div class="qty-controls">
              <button class="btn-qty" onclick="updateQty(${p.id}, -1)">-</button>
              <span style="font-weight: bold; min-width: 20px; text-align: center;">${p.qty}</span>
              <button class="btn-qty" onclick="updateQty(${p.id}, 1)">+</button>
            </div>
          </td>
          <td>
            <button class="btn-danger" onclick="deleteProduct(${p.id})">Excluir</button>
          </td>
        `;
        table.appendChild(row);
      });
    }

    // Renderizar Histórico
    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      if (history.length === 0) {
        list.innerHTML = '<div class="history-item">Nenhuma movimentação.</div>';
        return;
      }
      history.forEach(h => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<small>${h.date}</small><br><span>${h.text}</span>`;
        list.appendChild(item);
      });
    }

    // Inicialização
    renderProducts();
    renderHistory();
  </script>
</body>
</html>
